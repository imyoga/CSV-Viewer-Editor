<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSV Editor</title>
		<link rel="stylesheet" href="style.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
		<script src="script.js" defer></script>
	</head>
	<body>
		<header class="header">
			<div class="controls">
				<input type="file" id="csvFile" accept=".csv" class="file-input" />
				<label for="csvFile" class="upload-btn">Upload CSV</label>
				<button id="pasteBtn" class="paste-btn" type="button">Paste CSV</button>
				<button id="resetBtn" class="reset-btn" disabled>Reset Changes</button>
				<button id="saveBtn" class="save-btn" disabled>Save CSV</button>
			</div>
			<div class="info">
				<span id="fileName"></span>
				<span id="rowCount"></span>
			</div>
		</header>

		<!-- Paste CSV modal -->
		<div id="pasteOverlay" class="paste-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pasteTitle">
			<div class="paste-container">
				<div class="paste-header">
					<h2 id="pasteTitle">Paste CSV Content</h2>
					<button id="pasteCloseBtn" class="paste-close-btn" type="button" aria-label="Close">&times;</button>
				</div>
				<p class="paste-hint">Paste CSV text below (including the header row), then click Load.</p>
				<textarea id="pasteTextarea" class="paste-textarea" placeholder="name,age,city&#10;Alice,30,New York&#10;Bob,25,London" spellcheck="false"></textarea>
				<div class="paste-actions">
					<button id="pasteCancelBtn" class="paste-cancel-btn" type="button">Cancel</button>
					<button id="pasteLoadBtn" class="paste-load-btn" type="button">Load CSV</button>
				</div>
			</div>
		</div>

		<!-- Progress overlay -->
		<div id="progressOverlay" class="progress-overlay hidden">
			<div class="progress-container">
				<div class="progress-info">
					<span id="progressText">Processing...</span>
					<span id="progressPercent">0%</span>
				</div>
				<div class="progress-bar">
					<div id="progressFill" class="progress-fill"></div>
				</div>
				<div class="progress-details">
					<span id="progressDetails"></span>
				</div>
			</div>
		</div>

		<main class="main-content">
			<div id="tableContainer" class="table-container">
				<div class="placeholder">
					<p>Drop a CSV file here, click <button type="button" class="placeholder-link" data-action="upload">Upload CSV</button>, or <button type="button" class="placeholder-link" data-action="paste">Paste CSV</button></p>
				</div>
			</div>
		</main>
	</body>
</html>
